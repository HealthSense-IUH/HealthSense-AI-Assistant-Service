spring.application.name=hs-assistant
server.port=${SERVER_PORT:8081}
# =========================================================
# DATABASE / POSTGRESQL CONFIGURATION
# Dùng chung instance với Core Service, schema riêng "assistant"
# =========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:assistant}&options=-c%20timezone=Asia/Bangkok
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:assistant}
# =========================================================
# RABBITMQ CONFIGURATION
# Nghe sự kiện cảnh báo AF và lịch khám từ Core Service
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE}
app.rabbitmq.queue.assistant=${RABBITMQ_QUEUE_ASSISTANT}
# =========================================================
# ANTHROPIC CLAUDE CONFIGURATION
# API key tạo tại console.anthropic.com; đặt qua biến môi trường, không ghi vào file
# =========================================================
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL}
spring.ai.anthropic.chat.max-tokens=${ANTHROPIC_MAX_TOKENS:1024}
# Bộ nhớ hội thoại: Spring AI tự tạo bảng SPRING_AI_CHAT_MEMORY lần chạy đầu
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=postgresql
# =========================================================
# CORE SERVICE (các tool của mô hình gọi vào đây)
# =========================================================
app.core.base-url=${CORE_BASE_URL}
# =========================================================
# ACTUATOR / HEALTH
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:true}
